[workspace]
resolver = "2"
members = [
    "bin/aegisto",
    "crates/aegisto-core",
    "crates/aegisto-tui",
    "crates/aegisto-agent",
]

# `cargo run` / `cargo build` skip the heavy agent crate (reqwest + tokio)
# until it is actually wired in; use `--workspace` to build everything.
default-members = [
    "bin/aegisto",
    "crates/aegisto-core",
    "crates/aegisto-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
